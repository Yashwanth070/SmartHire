<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Gradient for depth and material feel -->
    <linearGradient id="arrowGradient" x1="20" y1="4" x2="20" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00a1ff"/>
      <stop offset="100%" stop-color="#0051d4"/>
    </linearGradient>
    <!-- Subtle shadow/glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Smooth rounded arrow/chevron pointing up -->
  <path 
    d="M8 28C8 28 20 10 20 10C20 10 32 28 32 28" 
    stroke="url(#arrowGradient)" 
    stroke-width="5" 
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
  
  <!-- Floating dot below for anti-gravity effect -->
  <circle cx="20" cy="35" r="2.5" fill="url(#arrowGradient)" opacity="0.7"/>
</svg>